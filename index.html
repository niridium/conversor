<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversor de Grados</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Conversor de Temperatura</h1>
        <div class="form-group">
            <label for="direction">Dirección:</label>
            <select id="direction">
                <option value="c2f">Celsius → Fahrenheit</option>
                <option value="f2c">Fahrenheit → Celsius</option>
            </select>
        </div>
        <div class="form-group">
            <label for="input" id="inputLabel">Temperatura en Celsius (°C):</label>
            <input type="number" id="input" placeholder="Introduce la temperatura" step="any">
        </div>
        <button id="convertBtn">Convertir</button>
        <div id="result" class="result"></div>
    </div>
    <script src="script.js"></script>
</body>
</html>
